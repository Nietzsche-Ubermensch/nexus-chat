<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nexus AI</title>
  <link rel="manifest" href="data:application/json,{&quot;name&quot;:&quot;Nexus AI&quot;,&quot;short_name&quot;:&quot;Nexus&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;%230a0a0a&quot;,&quot;theme_color&quot;:&quot;%233b82f6&quot;}">
  <meta name="theme-color" content="#3b82f6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0a0a0a;--surface:#1a1a1a;--border:#2a2a2a;--text:#fafafa;--text-dim:#888;--primary:#3b82f6;--primary-hover:#2563eb}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
    header{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
    header .logo{width:36px;height:36px;background:var(--primary);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:bold}
    header h1{font-size:18px;font-weight:600}
    .chat-container{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
    .message{max-width:85%;padding:12px 16px;border-radius:16px;line-height:1.5;white-space:pre-wrap}
    .message.user{background:var(--primary);align-self:flex-end;border-bottom-right-radius:4px}
    .message.assistant{background:var(--surface);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:4px}
    .message.system{background:transparent;color:var(--text-dim);font-size:13px;text-align:center;align-self:center}
    .input-area{padding:16px;border-top:1px solid var(--border);display:flex;gap:12px}
    #input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 16px;color:var(--text);font-size:16px;outline:none;resize:none;min-height:48px;max-height:120px}
    #input:focus{border-color:var(--primary)}
    #send{background:var(--primary);border:none;border-radius:12px;padding:12px 20px;color:white;font-weight:600;cursor:pointer;transition:background 0.2s}
    #send:hover{background:var(--primary-hover)}
    #send:disabled{opacity:0.5;cursor:not-allowed}
    .typing{display:flex;gap:4px;padding:12px 16px}
    .typing span{width:8px;height:8px;background:var(--text-dim);border-radius:50%;animation:bounce 1.4s infinite ease-in-out both}
    .typing span:nth-child(1){animation-delay:-0.32s}
    .typing span:nth-child(2){animation-delay:-0.16s}
    @keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
    .settings{padding:8px 16px;border-bottom:1px solid var(--border);display:flex;gap:16px;flex-wrap:wrap;font-size:13px}
    .settings label{display:flex;align-items:center;gap:6px}
    .settings select,.settings input[type="checkbox"]{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:6px}
  </style>
</head>
<body>
  <header><div class="logo">N</div><h1>Nexus AI</h1></header>
  <div class="settings">
    <label>Model:<select id="model"><option value="grok-4-latest">Grok-4</option><option value="grok-3-latest">Grok-3</option><option value="grok-3-mini-latest">Grok-3 Mini</option></select></label>
    <label><input type="checkbox" id="rag" checked>RAG Search</label>
  </div>
  <div class="chat-container" id="chat"><div class="message system">Connected to Grok-4. RAG search enabled.</div></div>
  <div class="input-area">
    <textarea id="input" placeholder="Ask anything..." rows="1"></textarea>
    <button id="send">Send</button>
  </div>
  <script>
    const API='https://ccjdctnmgrweserduxhi.supabase.co/functions/v1/chat-api';
    const chat=document.getElementById('chat'),input=document.getElementById('input'),sendBtn=document.getElementById('send'),modelSelect=document.getElementById('model'),ragCheckbox=document.getElementById('rag');
    let messages=[];
    function addMessage(role,content){const div=document.createElement('div');div.className='message '+role;div.textContent=content;chat.appendChild(div);chat.scrollTop=chat.scrollHeight;return div}
    function showTyping(){const div=document.createElement('div');div.className='message assistant typing';div.innerHTML='<span></span><span></span><span></span>';div.id='typing';chat.appendChild(div);chat.scrollTop=chat.scrollHeight}
    function hideTyping(){const el=document.getElementById('typing');if(el)el.remove()}
    async function sendMessage(){
      const content=input.value.trim();if(!content)return;
      input.value='';input.style.height='auto';sendBtn.disabled=true;
      addMessage('user',content);messages.push({role:'user',content});showTyping();
      try{
        const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages,model:modelSelect.value,enableRag:ragCheckbox.checked})});
        hideTyping();if(!res.ok)throw new Error('Request failed');
        const reader=res.body.getReader(),decoder=new TextDecoder();let assistantContent='';const assistantDiv=addMessage('assistant','');
        while(true){const{done,value}=await reader.read();if(done)break;const chunk=decoder.decode(value),lines=chunk.split('\n');
          for(const line of lines){if(line.startsWith('data: ')){const data=line.slice(6);if(data==='[DONE]')continue;try{const json=JSON.parse(data),delta=json.choices?.[0]?.delta?.content||'';assistantContent+=delta;assistantDiv.textContent=assistantContent;chat.scrollTop=chat.scrollHeight}catch{}}}}
        messages.push({role:'assistant',content:assistantContent});
      }catch(err){hideTyping();addMessage('system','Error: '+err.message)}
      sendBtn.disabled=false;input.focus();
    }
    sendBtn.addEventListener('click',sendMessage);
    input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});
    input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,120)+'px'});
  </script>
</body>
</html>
